<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smartschool Achievements Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f3efe6;
        --bg-accent: #e4f2ff;
        --ink: #1b1b1b;
        --muted: #57606a;
        --card: #ffffff;
        --accent: #f57c00;
        --accent-2: #00897b;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 10% 20%, var(--bg-accent), transparent 55%),
          radial-gradient(circle at 85% 10%, #ffe9d1, transparent 50%),
          var(--bg);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }

      .shell {
        width: min(960px, 100%);
        display: grid;
        gap: 28px;
      }

      header {
        display: grid;
        gap: 10px;
      }

      h1 {
        font-size: clamp(2.1rem, 3vw, 3rem);
        margin: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        max-width: 60ch;
      }

      .board {
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 26px;
        display: grid;
        gap: 18px;
      }

      .board-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .board-header .meta {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .auth-card {
        background: var(--card);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 22px 24px;
        display: grid;
        gap: 16px;
      }

      .auth-header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
      }

      .auth-buttons {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      .auth-btn {
        appearance: none;
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: #fff;
        color: var(--ink);
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .auth-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
      }

      .auth-btn:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        box-shadow: none;
        transform: none;
      }

      .auth-hint {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .name-form {
        display: grid;
        gap: 8px;
      }

      .name-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
      }

      .name-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .name-input {
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.95rem;
        font-family: "Space Grotesk", system-ui, sans-serif;
      }

      .name-save {
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: #fff;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.95rem;
      }

      .name-save:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .leaderboard {
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        grid-template-columns: 54px 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #f7f6f2;
        border: 1px solid rgba(0, 0, 0, 0.08);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .row:nth-child(odd) {
        background: #f0f7f5;
      }

      .row:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      }

      .rank {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: white;
        font-weight: 700;
        font-size: 1rem;
      }

      .name {
        font-weight: 600;
        font-size: 1.05rem;
      }

      .level {
        font-weight: 700;
        color: var(--accent-2);
        font-size: 1.1rem;
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #fff3e0;
        color: #b45309;
        font-weight: 600;
        font-size: 0.85rem;
      }

      @media (max-width: 720px) {
        .row {
          grid-template-columns: 42px 1fr;
          gap: 10px;
        }

        .level {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <span class="pill">Live from Smartschool Achievements</span>
        <h1>Leaderboard</h1>
        <p>Have fun on this leaderboard!</p>
      </header>

      <section class="auth-card">
        <div class="auth-header">
          <div>
            <strong>Sign in to claim your name</strong>
            <div id="auth-status" class="status">Not signed in.</div>
          </div>
          <button id="sign-out" class="auth-btn" type="button" hidden>Sign out</button>
        </div>
        <div class="auth-buttons" id="auth-controls">
          <button class="auth-btn" type="button" data-provider="google">Continue with Google</button>
          <button class="auth-btn" type="button" data-provider="discord">Continue with Discord</button>
          <button class="auth-btn" type="button" data-provider="github">Continue with GitHub</button>
        </div>
        <div class="name-form">
          <label class="name-label" for="display-name">Display name</label>
          <div class="name-row">
            <input id="display-name" class="name-input" type="text" placeholder="Choose your name" maxlength="24" />
            <button id="save-name" class="name-save" type="button">Save name</button>
          </div>
          <div id="name-status" class="auth-hint">Sign in to choose a name.</div>
        </div>
        <div class="auth-hint">Auth opens in a new tab because this page runs inside an iframe.</div>
      </section>

      <section class="board">
        <div class="board-header">
          <div>
            <strong>Top learners</strong>
          </div>
          <div class="meta" id="last-updated">Waiting for data...</div>
        </div>
        <div id="status" class="status">Loading leaderboard...</div>
        <div class="leaderboard" id="leaderboard"></div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = 'https://gyyijtmbnnfjnywajbcg.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5eWlqdG1ibm5mam55d2FqYmNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MjkxMzUsImV4cCI6MjA4OTAwNTEzNX0.FRs1eH7rAZ_EW2dyHtpKfKKsoe5nHQHvSUmZv5TeJCE';
      const LEADERBOARD_TABLE = 'leaderboard';
      const PAGE_SIZE = 500;
      const AUTH_REDIRECT = 'https://superman2775.github.io/Smartschool-Achievements/website/auth-callback.html';

      const fallbackParts = {
        adj: [
          'Brisk', 'Quiet', 'Solar', 'Nova', 'Iron', 'Swift', 'Wild', 'Lunar', 'Sharp', 'Bold',
          'Bright', 'Silent', 'Mighty', 'Clever', 'Fierce', 'Noble', 'Sly', 'Vivid', 'Daring', 'Stealthy',
          'Golden', 'Crimson', 'Azure', 'Amber', 'Emerald', 'Crystal', 'Shadowed', 'Stormy', 'Radiant', 'Frosty',
          'Glowing', 'Rugged', 'Curious', 'Fearless', 'Gentle', 'Hollow', 'Jovial', 'Keen', 'Lucky', 'Mellow'
        ],
        noun: [
          'Falcon', 'Comet', 'River', 'Pine', 'Echo', 'Orbit', 'Signal', 'Harbor', 'Glade', 'Forge',
          'Shadow', 'Blaze', 'Canyon', 'Meadow', 'Storm', 'Peak', 'Valley', 'Wolf', 'Hawk', 'Sparrow',
          'Cinder', 'Flare', 'Vortex', 'Summit', 'Beacon', 'Drift', 'Cascade', 'Harrier', 'Wanderer', 'Trail',
          'Grove', 'Mariner', 'Outrider', 'Quill', 'Ridge', 'Sage', 'Tide', 'Voyager', 'Zephyr', 'Anchor'
        ]
      };

      const isConfigured = () =>
        SUPABASE_URL &&
        SUPABASE_ANON_KEY &&
        !SUPABASE_URL.includes('YOUR_') &&
        !SUPABASE_ANON_KEY.includes('YOUR_');

      const supabaseClient = isConfigured()
        ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
              flowType: 'implicit',
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false
            }
          })
        : null;

      const leaderboardEl = document.getElementById('leaderboard');
      const statusEl = document.getElementById('status');
      const updatedEl = document.getElementById('last-updated');
      const authStatusEl = document.getElementById('auth-status');
      const authControlsEl = document.getElementById('auth-controls');
      const signOutBtn = document.getElementById('sign-out');
      const nameInputEl = document.getElementById('display-name');
      const saveNameBtn = document.getElementById('save-name');
      const nameStatusEl = document.getElementById('name-status');
      const linkedClientId = new URLSearchParams(window.location.search).get('cid');
      let currentSession = null;

      const setNameControls = (enabled) => {
        if (!nameInputEl || !saveNameBtn) return;
        nameInputEl.disabled = !enabled;
        saveNameBtn.disabled = !enabled;
      };

      const normalizeName = (value) => value.trim().replace(/\s+/g, ' ');

      const loadLinkedName = async () => {
        if (!supabaseClient || !linkedClientId || !nameInputEl) return;
        const { data, error } = await supabaseClient
          .from(LEADERBOARD_TABLE)
          .select('name')
          .eq('client_id', linkedClientId)
          .limit(1);

        if (!error && data && data[0] && data[0].name) {
          nameInputEl.value = data[0].name;
        }
      };

      const setNameUi = async (session) => {
        if (!nameStatusEl) return;

        if (!supabaseClient) {
          nameStatusEl.textContent = 'Supabase is not configured yet.';
          setNameControls(false);
          return;
        }

        if (!session) {
          nameStatusEl.textContent = 'Sign in to choose a name.';
          setNameControls(false);
          return;
        }

        if (!linkedClientId) {
          nameStatusEl.textContent = 'Open the leaderboard from the extension to link your account.';
          setNameControls(false);
          return;
        }

        nameStatusEl.textContent = 'Choose a display name (3-24 characters).';
        setNameControls(true);
        if (!nameInputEl.dataset.loaded) {
          await loadLinkedName();
          nameInputEl.dataset.loaded = 'true';
        }
      };

      const setAuthUi = (session) => {
        currentSession = session;
        if (!authStatusEl) return;

        if (!supabaseClient) {
          authStatusEl.textContent = 'Supabase is not configured yet.';
          if (authControlsEl) {
            authControlsEl.querySelectorAll('button').forEach((btn) => {
              btn.disabled = true;
            });
          }
          if (signOutBtn) {
            signOutBtn.hidden = true;
          }
          return;
        }

        if (session && session.user) {
          const meta = session.user.user_metadata || {};
          const name = meta.full_name || meta.user_name || session.user.email || 'Signed in';
          authStatusEl.textContent = `Signed in as ${name}.`;
          if (signOutBtn) {
            signOutBtn.hidden = false;
          }
        } else {
          authStatusEl.textContent = 'Not signed in.';
          if (signOutBtn) {
            signOutBtn.hidden = true;
          }
        }

        setNameUi(session);
      };

      const startOAuth = async (provider) => {
        if (!supabaseClient) {
          setAuthUi(null);
          return;
        }

        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider,
          options: {
            redirectTo: AUTH_REDIRECT,
            skipBrowserRedirect: true
          }
        });

        if (error || !data?.url) {
          authStatusEl.textContent = 'Could not start sign-in.';
          return;
        }

        const authWindow = window.open(data.url, '_blank', 'width=520,height=720');
        if (!authWindow) {
          window.location.href = data.url;
        }
      };
      const randomName = () => {
        const adj = fallbackParts.adj[Math.floor(Math.random() * fallbackParts.adj.length)];
        const noun = fallbackParts.noun[Math.floor(Math.random() * fallbackParts.noun.length)];
        const suffix = Math.floor(10 + Math.random() * 90);
        return `${adj}${noun}${suffix}`;
      };

      const render = (rows) => {
        leaderboardEl.innerHTML = '';
        rows.forEach((row, index) => {
          const item = document.createElement('div');
          item.className = 'row';

          const rank = document.createElement('div');
          rank.className = 'rank';
          rank.textContent = index + 1;

          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = row.name;

          const level = document.createElement('div');
          level.className = 'level';
          const xpValue = typeof row.xp === 'number' ? row.xp : 0;
          level.textContent = `XP ${xpValue}`;

          item.appendChild(rank);
          item.appendChild(name);
          item.appendChild(level);
          leaderboardEl.appendChild(item);
        });
      };

      const renderFallback = () => {
        const rows = Array.from({ length: 10 }, () => ({
          name: randomName(),
          xp: Math.floor(100 + Math.random() * 5000)
        })).sort((a, b) => b.xp - a.xp);

        statusEl.textContent = 'Supabase not configured yet. Showing demo data.';
        render(rows);
        updatedEl.textContent = 'Demo mode';
      };

      const fetchAllRows = async (client) => {
        let allRows = [];
        let from = 0;

        while (true) {
          const { data, error } = await client
            .from(LEADERBOARD_TABLE)
            .select('client_id, name, xp, updated_at')
            .order('xp', { ascending: false })
            .order('updated_at', { ascending: false })
            .order('client_id', { ascending: true })
            .range(from, from + PAGE_SIZE - 1);

          if (error) {
            return { data: null, error };
          }

          if (!data || data.length === 0) {
            break;
          }

          allRows = allRows.concat(data);

          if (data.length < PAGE_SIZE) {
            break;
          }

          from += PAGE_SIZE;
        }

        return { data: allRows, error: null };
      };

      const loadLeaderboard = async () => {
        if (!supabaseClient) {
          renderFallback();
          return;
        }

        statusEl.textContent = 'Syncing with Supabase...';
        const { data, error } = await fetchAllRows(supabaseClient);

        if (error) {
          statusEl.textContent = 'Could not load the leaderboard.';
          updatedEl.textContent = 'Check your Supabase credentials.';
          return;
        }

        statusEl.textContent = data.length ? '' : 'No entries yet.';
        render(data);
        const latest = data[0]?.updated_at;
        updatedEl.textContent = latest ? `Last update: ${new Date(latest).toLocaleString()}` : 'Waiting for updates...';
      };

      loadLeaderboard();

      if (supabaseClient) {
        const loadCachedSession = async () => {
          try {
            const cached = sessionStorage.getItem('ssa_auth_session');
            if (!cached) {
              setAuthUi(null);
              return;
            }

            const parsed = JSON.parse(cached);
            if (!parsed?.access_token || !parsed?.refresh_token) {
              setAuthUi(null);
              return;
            }

            const { data, error } = await supabaseClient.auth.setSession({
              access_token: parsed.access_token,
              refresh_token: parsed.refresh_token
            });

            if (error) {
              setAuthUi(null);
              return;
            }

            setAuthUi(data?.session || null);
          } catch {
            setAuthUi(null);
          }
        };

        loadCachedSession();

        supabaseClient.auth.onAuthStateChange((_event, session) => {
          setAuthUi(session);
        });
      } else {
        setAuthUi(null);
      }

      if (authControlsEl) {
        authControlsEl.querySelectorAll('button[data-provider]').forEach((btn) => {
          btn.addEventListener('click', () => {
            startOAuth(btn.dataset.provider);
          });
        });
      }

      if (signOutBtn) {
        signOutBtn.addEventListener('click', async () => {
          if (!supabaseClient) return;
          try {
            sessionStorage.removeItem('ssa_auth_session');
          } catch {}
          await supabaseClient.auth.signOut();
        });
      }

      if (saveNameBtn) {
        saveNameBtn.addEventListener('click', async () => {
          if (!supabaseClient || !currentSession) {
            if (nameStatusEl) {
              nameStatusEl.textContent = 'Sign in to choose a name.';
            }
            return;
          }

          if (!linkedClientId) {
            if (nameStatusEl) {
              nameStatusEl.textContent = 'Open the leaderboard from the extension to link your account.';
            }
            return;
          }

          const cleaned = normalizeName(nameInputEl.value || '');
          if (cleaned.length < 3 || cleaned.length > 24) {
            nameStatusEl.textContent = 'Name must be 3-24 characters.';
            return;
          }

          saveNameBtn.disabled = true;
          const now = new Date().toISOString();
          const { data: updated, error: updateError } = await supabaseClient
            .from(LEADERBOARD_TABLE)
            .update({ name: cleaned, updated_at: now })
            .eq('client_id', linkedClientId)
            .select('client_id');

          if (updateError) {
            nameStatusEl.textContent = 'Could not save name.';
            saveNameBtn.disabled = false;
            return;
          }

          if (!updated || updated.length === 0) {
            const { error: upsertError } = await supabaseClient
              .from(LEADERBOARD_TABLE)
              .upsert({
                client_id: linkedClientId,
                name: cleaned,
                xp: 0,
                level: 0,
                updated_at: now
              });

            if (upsertError) {
              nameStatusEl.textContent = 'Could not save name.';
              saveNameBtn.disabled = false;
              return;
            }
          }

          nameStatusEl.textContent = 'Name updated.';
          saveNameBtn.disabled = false;
          loadLeaderboard();
        });
      }

      window.addEventListener('message', async (event) => {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'SSA_AUTH') return;
        if (!supabaseClient) return;

        const { access_token, refresh_token } = event.data;
        if (!access_token || !refresh_token) {
          setAuthUi(null);
          return;
        }

        const { data, error } = await supabaseClient.auth.setSession({
          access_token,
          refresh_token
        });

        if (error) {
          setAuthUi(null);
          return;
        }

        try {
          sessionStorage.setItem('ssa_auth_session', JSON.stringify({ access_token, refresh_token }));
        } catch {}

        setAuthUi(data?.session || null);
      });
    </script>
  </body>
</html>
