<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smartschool Achievements Auth</title>
    <style>
      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #f5f5f5;
        color: #222;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        padding: 24px 28px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        max-width: 420px;
        text-align: center;
      }

      h1 {
        font-size: 1.3rem;
        margin: 0 0 8px;
      }

      p {
        margin: 0;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Finishing sign-in...</h1>
      <p>You can close this tab once it completes.</p>
      <p id="status"></p>
    </div>

    <script>
      const statusEl = document.getElementById('status');

      const parseParams = (source) => {
        const params = new URLSearchParams(source.replace(/^#/, ''));
        const entries = {};
        params.forEach((value, key) => {
          entries[key] = value;
        });
        return entries;
      };

      const finish = () => {
        const hashParams = parseParams(window.location.hash || '');
        const accessToken = hashParams.access_token;
        const refreshToken = hashParams.refresh_token;

        if (!accessToken || !refreshToken) {
          statusEl.textContent = 'Sign-in failed. Please try again.';
          return;
        }

        if (window.opener) {
          window.opener.postMessage({
            type: 'SSA_AUTH',
            access_token: accessToken,
            refresh_token: refreshToken
          }, window.location.origin);
        }

        statusEl.textContent = 'Signed in successfully. You can return to the leaderboard.';
        setTimeout(() => {
          window.close();
        }, 500);
      };

      finish();
    </script>
  </body>
</html>
